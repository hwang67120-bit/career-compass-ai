[project]
name = "ai-python"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.139.2",
    "google-genai>=2.14.0",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "packaging>=26.0",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.32",
    "tomli>=2.0.0 ; python_full_version < '3.11'",
    "truststore>=0.10.4",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.7",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "truststore>=0.10.4",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.pytest.ini_options]
markers = [
    "real_gemini: 실제 Gemini API를 호출하는 테스트. 기본 `pytest` 실행에서 제외되며 `pytest -m real_gemini`로 명시 실행한다.",
    "real_ollama: 실제 Ollama(11434)를 호출하는 테스트. 기본 `pytest` 실행에서 제외되며 `pytest -m real_ollama`로 명시 실행한다.",
]
addopts = "-m \"not real_gemini and not real_ollama\""

[tool.mypy]
plugins = ["pydantic.mypy"]
