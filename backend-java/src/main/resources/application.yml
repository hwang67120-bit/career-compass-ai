logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] requestId=%X{requestId:-none} %logger{36} - %msg%n"

spring:
  application:
    name: career-compass-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration

  docker:
    compose:
      file: compose.yaml

management:
  endpoints:
    web:
      exposure:
        include: health

github:
  api:
    base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    api-version: ${GITHUB_API_VERSION:2022-11-28}
    user-agent: ${GITHUB_API_USER_AGENT:career-compass-ai}
    connect-timeout: ${GITHUB_API_CONNECT_TIMEOUT}
    read-timeout: ${GITHUB_API_READ_TIMEOUT}

python:
  worker:
    base-url: ${PYTHON_WORKER_BASE_URL:http://localhost:8000}
    internal-token: ${INTERNAL_SERVICE_TOKEN}

# 2026-08-04 임시 작업(코덱스 사용량 한도 공백기 대응) — 사람인 키 도착 전까지 고용24 단일
# Provider만 사용한다. 확인 필요: 실제 표본 기준 타임아웃·폴링 주기 재조정.
work24:
  api:
    base-url: ${WORK24_API_BASE_URL:https://www.work24.go.kr}
    auth-key: ${WORK24_API_KEY}
    connect-timeout: ${WORK24_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${WORK24_API_READ_TIMEOUT:10s}

job-analysis:
  worker:
    fixed-delay-ms: ${JOB_ANALYSIS_WORKER_FIXED_DELAY_MS:5000}

technology-tag:
  policy:
    max-query-length: ${TECHNOLOGY_TAG_MAX_QUERY_LENGTH:50}
    max-search-results: ${TECHNOLOGY_TAG_MAX_SEARCH_RESULTS:30}
  resolution:
    max-names: ${TECHNOLOGY_TAG_RESOLUTION_MAX_NAMES:30}
    max-name-length: ${TECHNOLOGY_TAG_RESOLUTION_MAX_NAME_LENGTH:100}

user:
  profile:
    max-target-job-title-length: ${USER_PROFILE_MAX_TARGET_JOB_TITLE_LENGTH:100}
    max-technology-tag-count: ${USER_PROFILE_MAX_TECHNOLOGY_TAG_COUNT:30}
    max-custom-tag-name-length: ${USER_PROFILE_MAX_CUSTOM_TAG_NAME_LENGTH:100}
