plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.careercompass'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// REST API, 파일 업로드, Python 서버 호출, SSE
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// 이메일·파일 크기·요청값 검증
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// GitHub API 호출용 명령형 HTTP 클라이언트 자동 구성
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	// PostgreSQL 데이터 저장
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// PostgreSQL JDBC 드라이버
	runtimeOnly 'org.postgresql:postgresql'
	// 회원가입·로그인·권한 검사
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// GitHub OAuth 로그인과 세션 인증
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	// DB 스키마 변경 이력 관리
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	// Flyway의 PostgreSQL 지원
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	// 서버 상태와 헬스 체크
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// 고용24 Open API의 XML 응답 역직렬화(Spring Boot Jackson BOM이 버전 관리)
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
	// 고용24 채용정보 상세 페이지(HTML)에서 본문 텍스트만 추출
	implementation 'org.jsoup:jsoup:1.21.1'
	// 개발 시 PostgreSQL 컨테이너 자동 연결
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	// JUnit, Mockito, AssertJ
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Spring Boot 4의 RestClient 테스트 슬라이스
	testImplementation 'org.springframework.boot:spring-boot-restclient-test'
	// Spring Boot 4의 MockMvc 테스트 슬라이스
	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	// 로그인·권한 테스트
	testImplementation 'org.springframework.security:spring-security-test'
	// Spring과 테스트 컨테이너 연결
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	// Spring Boot 4.1.0이 관리하는 Testcontainers 모듈 버전 정렬
	testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
	// 실제 PostgreSQL 통합 테스트
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
