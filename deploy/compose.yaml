# 통합 테스트 배포용 Compose. 요구사항: docs/operations/runtime-connectivity-runbook.md.
# 기존 backend-java/compose.yaml과 함께 운영하지 않는다(이 파일이 통합본).
# Ollama 서비스는 만들지 않는다 — 별도 모델 머신을 OLLAMA_BASE_URL로 호출.
# 브라우저 접근은 Java(8080)만 공개하고 Python·Postgres 포트는 host에 열지 않는다.

name: career-compass

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # 포트 미공개(내부망 전용)

  ai-python:
    build:
      context: ../ai-python
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}          # 별도 모델 머신 (localhost 아님)
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_JOB_POSTING_RESPONSIBILITY_MODEL: ${OLLAMA_JOB_POSTING_RESPONSIBILITY_MODEL}
      OLLAMA_EVIDENCE_JUDGE_MODEL: ${OLLAMA_EVIDENCE_JUDGE_MODEL}
      OLLAMA_PROJECT_RESPONSIBILITY_MODEL: ${OLLAMA_PROJECT_RESPONSIBILITY_MODEL}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL}
      JOB_POSTING_EXTRACTION_MAX_TEXT_LENGTH: ${JOB_POSTING_EXTRACTION_MAX_TEXT_LENGTH}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # 포트 미공개(내부망 전용). Java만 http://ai-python:8000 으로 접근.

  backend-java:
    build:
      context: ../backend-java
    depends_on:
      postgres:
        condition: service_healthy
      ai-python:
        condition: service_healthy
    environment:
      # 기본 prod(OAuth·세션). 시연 시 .env에서 "prod,demo"로 바꾸면 DevSample 공급자
      # 사용 가능(JOB_SEARCH_PROVIDER=dev-sample와 함께).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # 채용공고 공급자. 기본 public-employment. 시연은 dev-sample(기술 콘텐츠 대표 공고).
      JOB_SEARCH_PROVIDER: ${JOB_SEARCH_PROVIDER:-public-employment}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      PYTHON_WORKER_BASE_URL: http://ai-python:8000
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # 필수(기본값 없음) — 없으면 Java 기동 실패
      GITHUB_API_CONNECT_TIMEOUT: "3s"
      GITHUB_API_READ_TIMEOUT: "10s"
      PUBLIC_EMPLOYMENT_API_SERVICE_KEY: ${PUBLIC_EMPLOYMENT_API_SERVICE_KEY}
      # OAuth(prod 프로파일) — 로그인에 필요. GitHub OAuth App client-id/secret.
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET}
      # HTTP(비-HTTPS) LAN 테스트라 세션 쿠키 Secure 끔(안 그러면 로그인 쿠키 미전송)
      SESSION_COOKIE_SECURE: "false"
    # 브라우저 접근점 — Java만 공개. JAVA_BIND_ADDRESS로 노출 범위 제한(기본 127.0.0.1).
    # 내부망 브라우저 접근이 필요하면 서버에서 LAN IP로 지정 + 방화벽으로 범위 제한.
    ports:
      - "${JAVA_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  postgres-data:
